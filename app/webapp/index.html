  "ar": {"subtitle": "نشر مجهول · نص وصور", "intro": "اكتب ما تريد قوله وتحدث مع أعضاء المجموعة بشكل مجهول. لن تظهر رسالتك الأصلية في المجموعة.", "ask": "ماذا تريد أن تقول؟", "placeholder": "اكتب ما تريد قوله، يدعم النص والصور...", "hint_keys": "Ctrl / ⌘ + Enter لسطر جديد، Enter للإرسال", "add_image": "+ إضافة صور", "max_images": "حتى 10، اختيار متعدد", "drag_hint": "اسحب الصور أو الصق بـ Ctrl / ⌘ + V؛ انقر للتكبير", "nickname_label": "اسم العرض: ", "return_group": "العودة إلى المجموعة بعد الإرسال", "ready": "جاهز.", "sending": "جارٍ الإرسال...", "sent": "تم الإرسال ✓", "send_btn": "إرسال مجهول", "footer": "يظهر في المجموعة اسم مستعار مقنّع فقط. يمكن للمشرفين التحقق من هوية المرسل.", "replying": "رد على", "too_many": "حتى 10 صور", "need_content": "أدخل نصًا أو أضف صورة أولاً", "failed": "فشل الإرسال"}
};
const MAX_IMAGES = 10, MAX_LEN = 3800;
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const $ = (id) => document.getElementById(id);
const textEl = $("text"), countEl = $("count"), statusEl = $("status"),
      sendBtn = $("sendBtn"), thumbsEl = $("thumbs"), langSel = $("lang");
let images = [];   // {file, url}
let busy = false;
let curLang = "zh-CN";
const T = () => I18N[curLang] || I18N["zh-CN"];

function maskName(name) {
  name = (name || "").trim();
  if (!name) return "******";
  const chars = Array.from(name);
  if (chars.length === 1) return chars[0] + "******" + chars[0];
  return chars[0] + "******" + chars[chars.length - 1];
}
function setStatus(key, cls) {
  statusEl.textContent = typeof key === "string" && T()[key] ? T()[key] : key;
  statusEl.className = "status" + (cls ? " " + cls : "");
}
function applyLang(lang) {
  if (!I18N[lang]) lang = "zh-CN";
  curLang = lang;
  langSel.value = lang;
  const d = T();
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const k = el.getAttribute("data-i18n");
    if (d[k]) el.textContent = d[k];
  });
  textEl.placeholder = d.placeholder;
  document.documentElement.lang = lang;
  document.body.dir = lang === "ar" ? "rtl" : "ltr";
  setStatus("ready");
  try { localStorage.setItem("anon_lang", lang); } catch (e) {}
}
function detectLang() {
  try {
    const saved = localStorage.getItem("anon_lang");
    if (saved && I18N[saved]) return saved;
  } catch (e) {}
  const code = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user &&
                tg.initDataUnsafe.user.language_code || "").toLowerCase();
  if (code.startsWith("zh")) return /tw|hk|hant/.test(code) ? "zh-TW" : "zh-CN";
  if (code.startsWith("pt")) return "pt-BR";
  const map = {en: "en", fr: "fr", ja: "ja", vi: "vi", es: "es", de: "de",
               ko: "ko", id: "id", tr: "tr", ar: "ar"};
  return map[code.slice(0, 2)] || "zh-CN";
}
langSel.addEventListener("change", () => applyLang(langSel.value));

// 昵称打码（与原版一致：P******d）
(function initNick() {
  let name = "Pseudod";
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
    const u = tg.initDataUnsafe.user;
    name = ((u.first_name || "") + (u.last_name || "")) || u.username || name;
  }
  $("nickMask").textContent = maskName(name);
})();

// 回复目标（弹窗发言按钮经 startapp=reply_<消息ID> 带入）
const startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) ||
  new URLSearchParams(location.search).get("startapp") || "";
let replyTo = 0;
(function initReply() {
  const m = /^reply_(\d+)$/.exec(startParam || "");
  const q = new URLSearchParams(location.search).get("reply");
  if (m) replyTo = parseInt(m[1], 10);
  else if (q && /^\d+$/.test(q)) replyTo = parseInt(q, 10);
  if (!replyTo) return;
  fetch("/api/reply-info", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({initData: tg ? tg.initData : "preview", replyTo: replyTo})
  }).then((r) => r.json()).then((d) => {
    if (d && d.ok && d.codename) {
      const b = $("replyBanner");
      b.textContent = "↩ " + T().replying + " " + d.codename + "：" + d.snippet;
      b.style.display = "block";
    }
  }).catch(() => {});
})();

function refreshSendState() {
  countEl.textContent = String(textEl.value.length);
  sendBtn.classList.toggle("active", !!(textEl.value.trim() || images.length));
}
textEl.addEventListener("input", refreshSendState);
textEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
    e.preventDefault();
    doSend();
  }
});

function addFiles(fileList) {
  const files = Array.from(fileList || []).filter((f) => f.type.startsWith("image/"));
  for (const f of files) {
    if (images.length >= MAX_IMAGES) { setStatus("too_many", "err"); break; }
    images.push({file: f, url: URL.createObjectURL(f)});
  }
  renderThumbs();
  refreshSendState();
}
function renderThumbs() {
  thumbsEl.innerHTML = "";
  images.forEach((im, i) => {
    const box = document.createElement("div");
    box.className = "thumb";
    const img = document.createElement("img");
    img.src = im.url; img.alt = "";
    img.addEventListener("click", () => {
      $("overlayImg").src = im.url;
      $("overlay").classList.add("show");
    });
    const rm = document.createElement("button");
    rm.className = "rm"; rm.textContent = "×"; rm.type = "button";
    rm.addEventListener("click", () => {
      URL.revokeObjectURL(images[i].url);
      images.splice(i, 1);
      renderThumbs(); refreshSendState();
    });
    box.appendChild(img); box.appendChild(rm);
    thumbsEl.appendChild(box);
  });
}
$("overlay").addEventListener("click", () => $("overlay").classList.remove("show"));
$("addImg").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
const card = $("card");
["dragenter", "dragover"].forEach((ev) => card.addEventListener(ev, (e) => {
  e.preventDefault(); card.classList.add("dragover");
}));
["dragleave", "drop"].forEach((ev) => card.addEventListener(ev, (e) => {
  e.preventDefault(); card.classList.remove("dragover");
}));
card.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
document.addEventListener("paste", (e) => {
  const items = (e.clipboardData || {}).items || [];
  const files = [];
  for (const it of items) if (it.type.startsWith("image/")) files.push(it.getAsFile());
  if (files.length) addFiles(files);
});

function readAsB64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",", 2)[1] || "");
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
async function doSend() {
  if (busy) return;
  const text = textEl.value.trim();
  if (!text && !images.length) { setStatus("need_content", "err"); return; }
  busy = true;
  sendBtn.disabled = true;
  setStatus("sending");
  try {
    const imgs = [];
    for (const im of images) {
      imgs.push({name: im.file.name || "photo.jpg", data: await readAsB64(im.file)});
    }
    const resp = await fetch("/api/post", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        initData: tg ? tg.initData : "preview",
        startParam: startParam, text: text, images: imgs,
        replyTo: replyTo || 0, returnToGroup: $("retGroup").checked
      })
    });
    const d = await resp.json();
    if (!resp.ok || !d.ok) throw new Error(d.error || resp.status);
    setStatus("sent", "ok");
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    if ($("retGroup").checked && tg) {
      setTimeout(() => tg.close(), 400);
    } else {
      textEl.value = "";
      images.forEach((im) => URL.revokeObjectURL(im.url));
      images = [];
      renderThumbs(); refreshSendState();
      replyTo = 0;
      $("replyBanner").style.display = "none";
      setTimeout(() => setStatus("ready"), 1800);
    }
  } catch (err) {
    setStatus(T().failed + (err && err.message ? "：" + err.message : ""), "err");
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
  } finally {
    busy = false;
    sendBtn.disabled = false;
  }
}
sendBtn.addEventListener("click", doSend);

applyLang(detectLang());
refreshSendState();
</script>
</body>
</html>
